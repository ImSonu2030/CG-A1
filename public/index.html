<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL CG-A1</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="control-panel">
        <div>
            <label for="shapeId">Shape ID:</label>
            <select id="shapeId"></select>
        </div>

        <div>
            <label for="shapeColor">Color:</label>
            <input type="color" id="shapeColor" value="#ff0000">
        </div>

        <div>
            <label for="translateXSlider">Translate X:</label>
            <input type="range" id="translateXSlider" min="-1" max="1" step="0.01" value="0">
        </div>

        <div>
            <label for="translateYSlider">Translate Y:</label>
            <input type="range" id="translateYSlider" min="-1" max="1" step="0.01" value="0">
        </div>

        <div>
            <label for="rotateSlider">Rotate:</label>
            <input type="range" id="rotateSlider" min="-180" max="180" step="1" value="0">
        </div>

        <div>
            <label for="scaleSlider">Scale:</label>
            <input type="range" id="scaleSlider" min="1" max="5" step="0.1" value="1">
        </div>

        <div class="button-row">
            <button id="bringToFrontBtn">Bring to Front</button>
            <button id="bringToBackBtn">Bring to Back</button>
            <button id="toggleCursorBtn">Hide Cursor</button>
            <button id="disableCursorBtn">Disable Cursor</button>
            <br>
            <button id="clearCanvasBtn">Clear Canvas</button>
        </div>
    </div>

    <canvas id="webglCanvas"></canvas>

    <script src="shaders/vertex.js"></script>
    <script src="shaders/fragment.js"></script>
    <script src="./lib/shadeutil.js"></script>
    <script type="module" src="./main.js"></script>
</body>

</html>
